# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
# Deploying VitePress on Read the Docs https://docs.readthedocs.com/platform/stable/intro/vitepress.html

# Required
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    nodejs: "latest"
  jobs:
    install:
      - rm package.json yarn.lock # remove existed package file because of conflicts.
      - npm install vitepress@next # install vitepress v2
    build:
      html:
        # The site was created by running `vitepress init`
        # and following the official guide
        # https://vitepress.dev/guide/getting-started
        - ./node_modules/.bin/vitepress build docs
        - mkdir -p $READTHEDOCS_OUTPUT/
        - mv docs/.vitepress/dist $READTHEDOCS_OUTPUT/html